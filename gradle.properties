# Właściwości buildu Thumbcast (scalone z upstreamem v12.2, który miał tylko org.gradle.jvmargs=-Xmx3072m).

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: do włączenia po sprawdzeniu zgodności z upstreamowym :app (DO ZWERYFIKOWANIA).
# org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 ma domyślnie built-in Kotlin; nie wyłączamy go (android.builtInKotlin=false jest tylko na czas migracji).

# Kotlin
kotlin.code.style=official

# Thumbcast: liczba iteracji testów właściwości polityki lokalnie (CI nadpisuje na 100000).
thumbcast.policy.iterations=1000
