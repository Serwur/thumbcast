name: Feature request
description: Suggest a new feature or a change (you can write in English or Polish)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read FAIR_PLAY.md and CONTRIBUTING.md. Requests for macros, sequences, chords, turbo, auto-repeat,
        timers that generate presses, image analysis and multiboxing are closed.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work from the player's point of view?
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Which inputs does it send?
      description: For each touch or gesture, describe exactly which input (gamepad button, key, mouse) reaches the host.
    validations:
      required: true
  - type: checkboxes
    id: fairplay
    attributes:
      label: Fair-play checklist
      options:
        - label: Each touch produces at most one input.
          required: true
        - label: The feature does not generate input without a touch (timers, delays, repeats).
          required: true
        - label: The feature does not analyze the game image or read its memory or files.
          required: true
