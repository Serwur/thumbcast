name: Bug report
description: Report something that does not work (you can write in English or Polish)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately (SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Profile ...
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Control profile
      options: ["Pad – PlayStation / Xbox", "MMO – Pad+", "MMO – Keyboard", "Desktop – Touchpad", "Big Picture", "Own profile", "Legacy (upstream on-screen controls)", "Not relevant"]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host (OS, Sunshine version, gamepad driver)
      placeholder: "Windows 11, Sunshine v2026.914, ViGEmBus 1.22"
  - type: input
    id: version
    attributes:
      label: Thumbcast version (or commit)
    validations:
      required: true
  - type: checkboxes
    id: input-issue
    attributes:
      label: Input problem
      options:
        - label: Input stays “stuck” after lifting the finger
        - label: Input without a touch (ghost input) - a possible violation of the one touch = one input rule
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Log export from the app or `adb logcat`. Remove IP addresses and host names if you prefer.
      render: text
