name: Wynik testu w grze
description: Zgłoś wynik scenariusza z docs/test-plan.md (np. T-03)
labels: ["test-result"]
body:
  - type: dropdown
    id: scenario
    attributes:
      label: Scenariusz
      options: ["T-01", "T-02", "T-03", "T-04", "T-05", "T-06", "T-07", "T-08", "T-09"]
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Wynik
      options: ["OK", "FAIL", "częściowo"]
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Telefon / host / sieć / wersja Sunshine / wersja gry
    validations:
      required: true
  - type: textarea
    id: table
    attributes:
      label: Tabela wyników
      description: Wklej wypełnioną tabelę z docs/test-plan.md (dla T-03 sekcja 4.4).
    validations:
      required: true
