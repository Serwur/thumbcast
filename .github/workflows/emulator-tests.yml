# Testy instrumentacyjne :control-android na emulatorze (reactivecircus/android-emulator-runner).
#
# Uruchamiany tylko ręcznie (workflow_dispatch); nie jest wymaganym checkiem. Jedyny test to
# control-android/src/androidTest (MultiTouchInstrumentedTest, szkic). Po ustabilizowaniu dodać
# wyzwalacz pull_request. :app nie ma testów instrumentacyjnych (wariant: :app:connectedNonRootDebugAndroidTest).
#
# Wersje akcji: android-emulator-runner v2.38.0 (sprawdzone 7.11.2026), actions/cache v6 (v6.1.0, sprawdzone 11.11.2026).
# Obrazy system-images;android-{26,34,36};default;x86_64 są w repozytorium SDK Google (sys-img2-4.xml, 11.11.2026);
# "default" = obraz bez GMS (zgodny z założeniem F-Droid).
# Akceleracja KVM na runnerach Linux GitHub wymaga reguły udev (krok poniżej).
#
# Sprawdzone lokalnie 11.11.2026: :control-android:assembleDebugAndroidTest się kompiluje.
# connectedDebugAndroidTest ani sam workflow nie były uruchomione (brak urządzenia, brak przebiegu na GitHub).

name: emulator-tests

on:
  workflow_dispatch:
    inputs:
      api-levels:
        description: "Poziomy API emulatora, po przecinku (26 = minSdk, 36 = targetSdk)"
        required: false
        default: "26, 34, 36"

permissions:
  contents: read

jobs:
  instrumented:
    name: instrumented (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(format('[{0}]', inputs.api-levels || '26, 34, 36')) }}
    steps:
      # :control-android nie potrzebuje submodułów ani NDK (to tylko :app), ale checkout jest jak w ci.yml.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Włączenie KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-default-x86_64

      - name: Utworzenie snapshotu AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot AVD gotowy"

      - name: Testy instrumentacyjne
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --stacktrace :control-android:connectedDebugAndroidTest

      - name: Raporty
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
