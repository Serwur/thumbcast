# CI Thumbcast: testy JVM, testy właściwości polityki, lint, build APK debug.
#
# Wymagane checki w ochronie gałęzi main (Settings > Branches): "jvm-tests", "policy-tests".
# Nazwy jobów poniżej są nazwami checków; nie zmieniać ich bez aktualizacji ochrony gałęzi.
#
# Wersje akcji sprawdzone 7.11.2026 na stronach wydań:
#   actions/checkout v7, actions/setup-java v6, gradle/actions/setup-gradle v6 (v6.4.1), actions/upload-artifact v7.
#
# Gradle: zawsze ./gradlew (wrapper z upstreamu, wersja i distributionSha256Sum w
# gradle/wrapper/gradle-wrapper.properties). setup-gradle bez `gradle-version` tylko cache'uje
# i sprawdza gradle-wrapper.jar (validate-wrappers domyślnie włączone).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: jvm-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (z submodułami upstreamu)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Testy JVM (model i silnik)
        run: ./gradlew --stacktrace :control-model:test :control-engine:test

      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  policy-tests:
    # Zasada nadrzędna: 1 dotyk = 1 wejście (FAIR_PLAY.md, plan sekcja 6.2 pkt 7).
    # Job uruchamia testy właściwości ActionPolicy z 100 000 iteracji.
    # Konwencja (CONTRACT-NOTES.md, sekcja SCAFFOLD): klasy testów polityki mają w nazwie "Policy"
    # i leżą w :control-engine. Jeśli filtr nie znajdzie żadnego testu, Gradle kończy się błędem,
    # więc usunięcie testów polityki też zablokuje merge.
    name: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Testy właściwości polityki (10^5 iteracji)
        run: >
          ./gradlew --stacktrace :control-engine:test
          --tests '*Policy*'
          -Pthumbcast.policy.iterations=100000

      - name: Sprawdzenie, że testy polityki faktycznie się wykonały
        run: |
          set -euo pipefail
          dir=control-engine/build/test-results/test
          if [ ! -d "$dir" ]; then echo "Brak wyników testów polityki w $dir"; exit 1; fi
          sum() { grep -ho "$1=\"[0-9]*\"" "$dir"/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          count=$(sum tests)
          failures=$(sum failures)
          errors=$(sum errors)
          echo "Testy polityki: $count, porażki: $failures, błędy: $errors"
          if [ "$count" -eq 0 ]; then echo "Żaden test polityki się nie wykonał"; exit 1; fi
          if [ "$failures" -ne 0 ] || [ "$errors" -ne 0 ]; then echo "Naruszenie zasady 1 dotyk = 1 wejście"; exit 1; fi

      - name: Raporty testów polityki
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-policy
          path: |
            control-engine/build/reports/tests/
            control-engine/build/test-results/
          if-no-files-found: warn
          retention-days: 30

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Android Lint dla :control-android. Lint :app jest w jobie app-build (ten sam setup co build APK).
      # ktlint/detekt (plan sekcja 3) dodać po wpisaniu ich wersji do libs.versions.toml.
      - name: Android Lint
        run: ./gradlew --stacktrace :control-android:lint

      - name: Strażnik nazw i zakazanych zależności
        run: |
          set -euo pipefail
          # Zakazane zależności (wymóg F-Droid, plan sekcja 3).
          if grep -rniE 'firebase|crashlytics|play-services|com\.google\.android\.gms' \
               --include='*.kts' --include='*.gradle' --include='*.toml' . ; then
            echo "Wykryto zakazaną zależność (Firebase/Crashlytics/Play Services)"; exit 1
          fi
          # Zakazane typy w presetach (plan sekcja 5.3). Sprawdza pola "type"/"behavior" i klucze JSON,
          # a nie dowolne napisy, więc etykieta w rodzaju "Delay" nie jest błędem.
          python3 .github/scripts/check_presets.py presets

      - name: Raporty lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results*.*"
          if-no-files-found: ignore
          retention-days: 14

  app-build:
    # Build aplikacji (:app, upstream + hooki Thumbcast) i Android Lint :app.
    # Nie jest wymaganym checkiem (stan 11.11.2026).
    name: app-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # :app buduje moonlight-common-c (z enet i nanors) przez ndkBuild, więc submoduły są konieczne.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # NDK instalowany jawnie, choć AGP umie go pobrać sam: wersja jest czytana z app/build.gradle
      # (jedno źródło prawdy), błąd pobierania widać w osobnym kroku zamiast w środku buildu,
      # a krok nie zależy od tego, które NDK akurat są w obrazie runnera (gdy wersja już jest, nic nie pobiera).
      - name: NDK (wersja z app/build.gradle)
        run: |
          set -euo pipefail
          ndk=$(sed -n 's/^[[:space:]]*ndkVersion[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)
          if [ -z "$ndk" ]; then echo "Nie znaleziono ndkVersion w app/build.gradle"; exit 1; fi
          echo "NDK $ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          test -d "$ANDROID_HOME/ndk/$ndk"

      - name: Build APK debug
        run: ./gradlew --stacktrace :app:assembleNonRootDebug

      - name: APK debug jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: thumbcast-debug-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Lint :app: upstream v12.2 + hooki daje 0 błędów i ok. 260 ostrzeżeń (lokalnie 11.11.2026),
      # więc krok blokuje tylko nowe błędy (abortOnError AGP); ostrzeżenia są w raporcie.
      - name: Android Lint :app
        run: ./gradlew --stacktrace :app:lintNonRootDebug

      - name: Raport lint :app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-nonRootDebug.*
          if-no-files-found: ignore
          retention-days: 14
