# Release Thumbcast: podpisany APK (GitHub) i AAB (Google Play), sumy SHA-256, GitHub Release.
#
# Uruchamiany tagiem v* (np. v0.1.0). Tag musi odpowiadać źródłom (GPLv3, plan sekcja 11).
#
# Wymagane sekrety repozytorium (Settings > Secrets and variables > Actions):
#   THUMBCAST_KEYSTORE_BASE64   keystore (.jks) zakodowany base64 (base64 -w0 release.jks)
#   THUMBCAST_KEYSTORE_PASSWORD hasło keystore
#   THUMBCAST_KEY_ALIAS         alias klucza
#   THUMBCAST_KEY_PASSWORD      hasło klucza
#
# Sekrety trafiają do :app jako właściwości Gradle thumbcastKeystoreFile, thumbcastKeystorePassword,
# thumbcastKeyAlias, thumbcastKeyPassword (signingConfigs.release w app/build.gradle). Bez nich
# AGP daje app-nonRoot-release-unsigned.apk i krok weryfikacji podpisu kończy się błędem.
#
# Sprawdzone lokalnie 11.11.2026 (testowy keystore): :app:assembleNonRootRelease z tymi właściwościami
# daje app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk, pasuje do APK_GLOB, apksigner verify OK.
# Sam workflow nie był uruchomiony na GitHub Actions.
#
# AAB (12.11.2026): :app:bundleNonRootRelease, podpisany tym samym kluczem (klucz przesyłania w Google Play).
# Plik trafia do GitHub Release obok APK; do Play wgrywa się go ręcznie (docs/play-release.md).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag istniejącego wydania (np. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  APP_ASSEMBLE_TASK: ":app:assembleNonRootRelease"
  APP_BUNDLE_TASK: ":app:bundleNonRootRelease"
  APK_GLOB: "app/build/outputs/apk/**/release/*.apk"
  AAB_GLOB: "app/build/outputs/bundle/**/*.aab"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (z submodułami upstreamu)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Jak w ci.yml (job app-build): NDK jawnie, wersja z app/build.gradle.
      - name: NDK (wersja z app/build.gradle)
        run: |
          set -euo pipefail
          ndk=$(sed -n 's/^[[:space:]]*ndkVersion[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)
          if [ -z "$ndk" ]; then echo "Nie znaleziono ndkVersion w app/build.gradle"; exit 1; fi
          echo "NDK $ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          test -d "$ANDROID_HOME/ndk/$ndk"

      # Tag ma odpowiadać versionName z app/build.gradle (np. v0.1.0 = "0.1.0").
      - name: Zgodność tagu z versionName
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)
          if [ "v$ver" != "$TAG" ]; then echo "Tag $TAG nie pasuje do versionName $ver"; exit 1; fi

      # Bramka: release nie powstaje bez zielonych testów polityki.
      - name: Testy JVM i testy polityki
        run: >
          ./gradlew --stacktrace :control-model:test :control-engine:test
          -Pthumbcast.policy.iterations=100000

      - name: Odtworzenie keystore z sekretu
        env:
          KEYSTORE_B64: ${{ secrets.THUMBCAST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THUMBCAST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THUMBCAST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THUMBCAST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "Brak sekretu THUMBCAST_${v/B64/BASE64}"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "THUMBCAST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # :app czyta podpis z właściwości Gradle (signingConfigs.release w app/build.gradle).
      - name: Budowa podpisanego APK i AAB
        env:
          ORG_GRADLE_PROJECT_thumbcastKeystoreFile: ${{ env.THUMBCAST_KEYSTORE_FILE }}
          ORG_GRADLE_PROJECT_thumbcastKeystorePassword: ${{ secrets.THUMBCAST_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_thumbcastKeyAlias: ${{ secrets.THUMBCAST_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_thumbcastKeyPassword: ${{ secrets.THUMBCAST_KEY_PASSWORD }}
        run: ./gradlew --stacktrace "$APP_ASSEMBLE_TASK" "$APP_BUNDLE_TASK"

      - name: Zebranie APK, AAB i sumy SHA-256
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mkdir -p dist
          files=( $APK_GLOB )
          if [ ${#files[@]} -eq 0 ]; then echo "Nie znaleziono APK: $APK_GLOB"; exit 1; fi
          bundles=( $AAB_GLOB )
          if [ ${#bundles[@]} -eq 0 ]; then echo "Nie znaleziono AAB: $AAB_GLOB"; exit 1; fi
          cp "${files[@]}" "${bundles[@]}" dist/
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Weryfikacja podpisu APK
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          for f in dist/*.apk; do "$apksigner" verify --print-certs "$f"; done
          # AAB jest podpisany podpisem JAR (v1); jarsigner -verify bez -strict, bo certyfikat jest samopodpisany.
          for f in dist/*.aab; do jarsigner -verify "$f" | tee /dev/stderr | grep -q "jar verified"; done

      - name: Usunięcie keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="Wydanie $TAG. Pre-alpha, niezatwierdzone przez Blizzard. Sumy SHA-256 w SHA256SUMS.txt. Zasady: FAIR_PLAY.md."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Thumbcast $TAG" --notes "$notes" --prerelease --verify-tag
          fi
