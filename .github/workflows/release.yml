# Release Thumbcast: podpisany APK, sumy SHA-256, GitHub Release.
#
# Uruchamiany tagiem v* (np. v0.1.0). Tag musi odpowiadać źródłom (GPLv3, plan sekcja 11).
#
# Wymagane sekrety repozytorium (Settings > Secrets and variables > Actions):
#   THUMBCAST_KEYSTORE_BASE64   keystore (.jks) zakodowany base64 (base64 -w0 release.jks)
#   THUMBCAST_KEYSTORE_PASSWORD hasło keystore
#   THUMBCAST_KEY_ALIAS         alias klucza
#   THUMBCAST_KEY_PASSWORD      hasło klucza
#
# Moduł :app pojawi się dopiero po forku. Zadanie Gradle i ścieżka APK zależą od flavorów upstreamu
# (root / nonRoot, plan sekcja 1.3) i od flavoru "thumbcast" (plan sekcja 13, krok 6).
# DO ZWERYFIKOWANIA po forku: nazwa zadania w APP_ASSEMBLE_TASK i katalog wyjściowy w APK_GLOB.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag istniejącego wydania (np. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.7.1"
  APP_ASSEMBLE_TASK: ":app:assembleNonRootRelease"
  APK_GLOB: "app/build/outputs/apk/**/release/*.apk"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (z submodułami upstreamu)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true

      - name: Wybór polecenia Gradle
        run: |
          if [ -x ./gradlew ]; then echo "GW=./gradlew" >> "$GITHUB_ENV"; else echo "GW=gradle" >> "$GITHUB_ENV"; fi

      # Bramka: release nie powstaje bez zielonych testów polityki.
      - name: Testy JVM i testy polityki
        run: >
          $GW --stacktrace :control-model:test :control-engine:test
          -Pthumbcast.policy.iterations=100000

      - name: Odtworzenie keystore z sekretu
        env:
          KEYSTORE_B64: ${{ secrets.THUMBCAST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then echo "Brak sekretu THUMBCAST_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "THUMBCAST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # :app czyta podpis z właściwości Gradle (konfiguracja signingConfigs po forku, patrz docs/NEXT-STEPS.md).
      - name: Budowa podpisanego APK
        env:
          ORG_GRADLE_PROJECT_thumbcastKeystoreFile: ${{ env.THUMBCAST_KEYSTORE_FILE }}
          ORG_GRADLE_PROJECT_thumbcastKeystorePassword: ${{ secrets.THUMBCAST_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_thumbcastKeyAlias: ${{ secrets.THUMBCAST_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_thumbcastKeyPassword: ${{ secrets.THUMBCAST_KEY_PASSWORD }}
        run: $GW --stacktrace "$APP_ASSEMBLE_TASK"

      - name: Zebranie APK i sumy SHA-256
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mkdir -p dist
          files=( $APK_GLOB )
          if [ ${#files[@]} -eq 0 ]; then echo "Nie znaleziono APK: $APK_GLOB"; exit 1; fi
          cp "${files[@]}" dist/
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Weryfikacja podpisu APK
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          for f in dist/*.apk; do "$apksigner" verify --print-certs "$f"; done

      - name: Usunięcie keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="Wydanie $TAG. Pre-alpha, niezatwierdzone przez Blizzard. Sumy SHA-256 w SHA256SUMS.txt. Zasady: FAIR_PLAY.md."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Thumbcast $TAG" --notes "$notes" --prerelease --verify-tag
          fi
