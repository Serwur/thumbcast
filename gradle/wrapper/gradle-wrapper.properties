# Gradle wrapper: wersja jak w upstreamie moonlight-android (9.7.1) [Z:7].
# Binarka gradle-wrapper.jar i skrypty gradlew/gradlew.bat celowo NIE są w repo na etapie scaffoldu
# (środowisko offline, zakaz plików binarnych). Po forku przychodzą z upstreamem; inaczej:
#   gradle wrapper --gradle-version 9.7.1 --distribution-type bin
# DO ZWERYFIKOWANIA: dodać distributionSha256Sum z https://gradle.org/release-checksums/
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
