apply plugin: 'com.android.application'

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        // THUMBCAST: 26 (było 21), bo :control-android ma minSdk 26.
        minSdk 26
        targetSdk 36

        versionName "12.2"
        versionCode = 315

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        // THUMBCAST: flavor `root` (maxSdk 25) usunięty, bo minSdk 26 (DECISIONS.md pkt i).

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            // THUMBCAST: własny applicationId (DECISIONS.md pkt h, 11.11.2026), było "com.limelight".
            applicationId "io.github.serwur.thumbcast"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    // THUMBCAST: podpis release z właściwości Gradle (release.yml); bez nich release jest niepodpisany.
    signingConfigs {
        release {
            if (project.hasProperty('thumbcastKeystoreFile')) {
                storeFile file(project.property('thumbcastKeystoreFile'))
                storePassword project.property('thumbcastKeystorePassword')
                keyAlias project.property('thumbcastKeyAlias')
                keyPassword project.property('thumbcastKeyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Thumbcast (Debug)"
            resValue "string", "app_label_root", "Thumbcast (Debug)"
        }
        release {
            // THUMBCAST: sufiks ".unofficial" usunięty po zmianie applicationId, o co prosi
            // komentarz autora upstreamu (DECISIONS.md pkt i).
            if (project.hasProperty('thumbcastKeystoreFile')) {
                signingConfig signingConfigs.release
            }
            resValue "string", "app_label", "Thumbcast"
            resValue "string", "app_label_root", "Thumbcast"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    // THUMBCAST: presety z presets/ (walidowane w :control-model) jako assets/presets/ (patches/preferences.patch.md, pkt 6).
    sourceSets {
        main {
            // AGP nie przyjmuje tu Providera, więc katalog podajemy jako File.
            assets.srcDir layout.buildDirectory.dir("generated/thumbcastAssets").get().asFile
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

// THUMBCAST:
def copyThumbcastPresets = tasks.register('copyThumbcastPresets', Copy) {
    from(rootProject.file('presets')) { include '*.thumbcast.json' }
    into layout.buildDirectory.dir('generated/thumbcastAssets/presets')
}
tasks.named('preBuild') { dependsOn copyThumbcastPresets }
// THUMBCAST END

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // THUMBCAST: warstwa dotyku (dociąga :control-engine i :control-model).
    implementation project(':control-android')
}
